# /etc/nginx/sites-available/acadtrack
# certbot rewrites this file when it installs the certificate; run
#   certbot --nginx -d tracker.example.com
# after the HTTP-only version below is already serving.

server {
    listen 80;
    listen [::]:80;
    server_name tracker.example.com;

    # Let certbot answer its challenge, send everything else to HTTPS.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # nginx 1.18 syntax; "http2 on;" as its own directive needs 1.25+.
    listen 443 ssl http2;
    listen [::]:443 ssl;
    server_name tracker.example.com;

    ssl_certificate     /etc/letsencrypt/live/tracker.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tracker.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # This app is for one person; nothing here should ever be framed,
    # sniffed, or handed a referrer.
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 4m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Flask builds the OAuth redirect from this; without it the callback
        # is advertised as http:// and Google rejects the mismatch.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /static/ {
        alias /opt/acadtrack/static/;
        expires 7d;
        access_log off;
    }
}
